<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IAMAIHM - Modern AI Assistant</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #818cf8;
            --accent-secondary: #c084fc;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            color: #f8fafc;
            height: 100dvh;
            overflow: hidden;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }

        .chat-bubble-user {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .chat-bubble-ai {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
        }

        #chat-container::-webkit-scrollbar {
            width: 5px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 10px;
        }

        .typing-dot {
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        .onboarding-gradient {
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.1), rgba(192, 132, 252, 0.1));
        }
    </style>
</head>
<body class="flex flex-col">
    <!-- Splash Screen -->
    <div id="splash" class="fixed inset-0 z-50 flex items-center justify-center bg-[#020617] transition-opacity duration-700">
        <div class="text-center">
            <div class="w-20 h-20 mx-auto mb-4 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl flex items-center justify-center animate-pulse shadow-2xl shadow-indigo-500/20">
                <i class="fas fa-robot text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">IAMAIHM</h1>
            <p class="text-slate-500 text-sm mt-2 tracking-widest uppercase">Intelligent Assistant</p>
        </div>
    </div>

    <!-- Onboarding / Auth -->
    <div id="onboarding" class="fixed inset-0 z-40 hidden flex items-center justify-center p-6 onboarding-gradient">
        <div class="glass w-full max-w-md rounded-3xl p-8 space-y-6">
            <div class="text-center space-y-2">
                <h2 class="text-2xl font-bold">Welcome Back</h2>
                <p class="text-slate-400 text-sm">Configure your assistant to get started</p>
            </div>
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 ml-1">YOUR NAME</label>
                    <input type="text" id="user-name-input" placeholder="e.g. Alex" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 transition-colors">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 ml-1">OPENROUTER API KEY</label>
                    <div class="relative">
                        <input type="password" id="api-key-input" placeholder="sk-or-v1-..." class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 transition-colors">
                        <i class="fas fa-key absolute right-4 top-1/2 -translate-y-1/2 text-slate-600"></i>
                    </div>
                </div>
                <button id="start-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-600/20 transition-all transform active:scale-95">
                    Launch Assistant
                </button>
            </div>
            <p class="text-[10px] text-center text-slate-500 uppercase tracking-tighter">Your data is stored locally in your browser</p>
        </div>
    </div>

    <!-- Main App UI -->
    <div id="app" class="flex-1 flex flex-col hidden max-w-4xl mx-auto w-full relative">
        <!-- Header -->
        <header class="glass mx-4 mt-4 rounded-2xl px-6 py-4 flex items-center justify-between z-20">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-500/20 rounded-xl flex items-center justify-center text-indigo-400">
                    <i class="fas fa-robot text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-wide">IAMAIHM</h1>
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                        <span class="text-[10px] text-slate-400 uppercase font-medium" id="model-badge">GPT-4o Mini</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="settings-toggle" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-white/5 transition-colors text-slate-400">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <!-- Chat History -->
        <main id="chat-container" class="flex-1 overflow-y-auto px-4 py-6 space-y-6 scroll-smooth">
            <!-- Messages injected here -->
        </main>

        <!-- Input Area -->
        <footer class="p-4 z-20">
            <div class="glass rounded-3xl p-2 flex flex-col gap-2">
                <!-- File Preview -->
                <div id="file-preview-strip" class="hidden px-4 py-2 border-b border-white/5 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <img id="image-preview" class="hidden w-12 h-12 rounded-lg object-cover border border-white/10">
                        <div class="w-12 h-12 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-400" id="file-icon">
                            <i class="fas fa-file"></i>
                        </div>
                        <div class="text-xs">
                            <p id="file-name" class="font-medium text-slate-200 truncate max-w-[150px]"></p>
                            <p id="file-size" class="text-slate-500"></p>
                        </div>
                    </div>
                    <button id="clear-file" class="text-slate-500 hover:text-red-400 p-2"><i class="fas fa-times"></i></button>
                </div>

                <div class="flex items-end gap-2">
                    <button id="attach-btn" class="w-12 h-12 flex items-center justify-center rounded-2xl hover:bg-white/5 text-slate-400 transition-colors shrink-0">
                        <i class="fas fa-plus"></i>
                    </button>
                    <textarea id="user-input" rows="1" placeholder="Ask me anything..." class="flex-1 bg-transparent border-none outline-none py-3 px-2 resize-none text-sm max-h-32" style="scrollbar-width: none;"></textarea>
                    <button id="voice-btn" class="w-12 h-12 flex items-center justify-center rounded-2xl hover:bg-white/5 text-slate-400 transition-colors shrink-0">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <button id="send-btn" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white transition-all shrink-0 shadow-lg shadow-indigo-600/20 active:scale-90">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
            <p class="text-[9px] text-center text-slate-600 mt-2">IAMAIHM can make mistakes. Verify important info.</p>
        </footer>

        <!-- Settings Panel -->
        <div id="settings-panel" class="absolute inset-x-4 top-20 bottom-4 glass rounded-3xl z-30 hidden flex flex-col">
            <div class="p-6 border-b border-white/5 flex items-center justify-between">
                <h3 class="font-bold text-lg">Preferences</h3>
                <button id="close-settings" class="text-slate-400"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-6">
                <div class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500">AI MODEL</label>
                        <select id="model-select" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500">
                            <option value="openai/gpt-4o-mini" selected>GPT-4o Mini</option>
                            <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                            <option value="google/gemini-pro-1.5">Gemini Pro 1.5</option>
                            <option value="meta-llama/llama-3.1-405b-instruct">Llama 3.1 405B</option>
                        </select>
                    </div>
                    <div class="flex items-center justify-between py-2">
                        <div>
                            <p class="font-medium text-sm">Voice Response</p>
                            <p class="text-xs text-slate-500">Speak AI responses automatically</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="voice-response-toggle" class="sr-only peer">
                            <div class="w-11 h-6 bg-white/10 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-400 after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600 peer-checked:after:bg-white"></div>
                        </label>
                    </div>
                </div>
                <div class="pt-6 border-t border-white/5 space-y-3">
                    <button id="clear-history" class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-sm flex items-center gap-3 transition-colors">
                        <i class="fas fa-trash-alt text-red-400"></i>
                        Clear Conversation History
                    </button>
                    <button id="reset-app" class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-sm flex items-center gap-3 transition-colors">
                        <i class="fas fa-power-off text-amber-400"></i>
                        Reset All Settings & Key
                    </button>
                </div>
            </div>
            <div class="p-6 bg-white/5 rounded-b-3xl">
                <p class="text-[10px] text-slate-500 text-center uppercase tracking-widest">Version 2.0.0 "Fresh"</p>
            </div>
        </div>
    </div>

    <!-- Library Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <script>
        // --- APP STATE & CONFIG ---
        const MEMORY_KEY = 'iamaihm_v2_memory';
        const API_KEY_KEY = 'iamaihm_v2_api_key';

        let memory = {
            userName: '',
            history: [],
            preferences: {
                model: 'openai/gpt-4o-mini',
                voiceResponse: false
            }
        };

        // --- DOM ELEMENTS ---
        const splash = document.getElementById('splash');
        const onboarding = document.getElementById('onboarding');
        const app = document.getElementById('app');
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const startBtn = document.getElementById('start-btn');
        const settingsToggle = document.getElementById('settings-toggle');
        const settingsPanel = document.getElementById('settings-panel');
        const closeSettings = document.getElementById('close-settings');
        const modelSelect = document.getElementById('model-select');
        const voiceToggle = document.getElementById('voice-response-toggle');
        const clearHistoryBtn = document.getElementById('clear-history');
        const resetAppBtn = document.getElementById('reset-app');
        const modelBadge = document.getElementById('model-badge');

        // --- PWA & SERVICE WORKER ---
        function setupPWA() {
            const manifest = {
                name: 'IAMAIHM',
                short_name: 'IAMAIHM',
                description: 'Modern AI Assistant with Glassmorphism UI',
                start_url: './index.html',
                display: 'standalone',
                background_color: '#020617',
                theme_color: '#020617',
                icons: [{
                    src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23020617"/><text x="50" y="65" font-family="Arial" font-size="50" fill="%23818cf8" text-anchor="middle">IHM</text></svg>',
                    sizes: '192x192',
                    type: 'image/svg+xml'
                }]
            };

            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const manifestURL = URL.createObjectURL(manifestBlob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestURL;
            document.head.appendChild(link);

            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swURL = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swURL);
            }
        }

        // --- INITIALIZATION ---
        function init() {
            setupPWA();
            loadMemory();

            // Check for API Key
            const apiKey = localStorage.getItem(API_KEY_KEY);

            setTimeout(() => {
                splash.classList.add('opacity-0');
                setTimeout(() => {
                    splash.classList.add('hidden');
                    if (!apiKey) {
                        onboarding.classList.remove('hidden');
                    } else {
                        app.classList.remove('hidden');
                        renderHistory();
                    }
                }, 700);
            }, 2000);

            setupCoreListeners();
        }

        function loadMemory() {
            const saved = localStorage.getItem(MEMORY_KEY);
            if (saved) {
                memory = JSON.parse(saved);
                modelSelect.value = memory.preferences.model;
                voiceToggle.checked = memory.preferences.voiceResponse;
                modelBadge.textContent = modelSelect.options[modelSelect.selectedIndex].text;
            }
        }

        function saveMemory() {
            localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
        }

        // --- OPENROUTER API ---
        async function callOpenRouter(messages) {
            const apiKey = localStorage.getItem(API_KEY_KEY);
            if (!apiKey) throw new Error('API Key missing');

            const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`,
                    'HTTP-Referer': window.location.origin,
                    'X-Title': 'IAMAIHM'
                },
                body: JSON.stringify({
                    model: memory.preferences.model,
                    messages: [
                        { role: 'system', content: `You are IAMAIHM, a highly capable and friendly AI assistant. The user's name is ${memory.userName}.` },
                        ...messages.map(m => ({
                            role: m.role,
                            content: m.content
                        }))
                    ]
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error?.message || 'API request failed');
            }

            const data = await response.json();
            return data.choices[0].message.content;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !currentFile) return;

            // Reset input
            userInput.value = '';
            userInput.style.height = 'auto';

            // Handle multimodal if file present
            let messageContent = text;
            if (currentFile && currentFile.type.startsWith('image/')) {
                const base64 = await toBase64(currentFile);
                messageContent = [
                    { type: 'text', text: text || 'Analyze this image.' },
                    { type: 'image_url', image_url: { url: base64 } }
                ];
            }

            addMessage('user', messageContent);

            // Show Typing Indicator
            const typingId = 'typing-' + Date.now();
            showTyping(typingId);

            try {
                // Prepare context (last 10 messages)
                const context = memory.history.slice(-10);
                const aiResponse = await callOpenRouter(context);

                removeTyping(typingId);
                addMessage('ai', aiResponse);

                if (memory.preferences.voiceResponse) {
                    speak(aiResponse);
                }
            } catch (error) {
                removeTyping(typingId);
                addMessage('ai', '⚠️ Error: ' + error.message);
            }

            if (currentFile) clearFileSelection();
        }

        // --- FILE HANDLING ---
        let currentFile = null;
        const attachBtn = document.getElementById('attach-btn');
        const filePreviewStrip = document.getElementById('file-preview-strip');
        const imagePreview = document.getElementById('image-preview');
        const fileIcon = document.getElementById('file-icon');
        const fileNameDisp = document.getElementById('file-name');
        const fileSizeDisp = document.getElementById('file-size');
        const clearFileBtn = document.getElementById('clear-file');

        function setupFileListeners() {
            attachBtn.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*,text/*,.pdf,.doc,.docx,.json,.js,.py,.html,.css';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) handleFileSelection(file);
                };
                input.click();
            });

            clearFileBtn.addEventListener('click', clearFileSelection);
        }

        async function handleFileSelection(file) {
            currentFile = file;
            filePreviewStrip.classList.remove('hidden');
            fileNameDisp.textContent = file.name;
            fileSizeDisp.textContent = (file.size / 1024).toFixed(1) + ' KB';

            if (file.type.startsWith('image/')) {
                imagePreview.classList.remove('hidden');
                fileIcon.classList.add('hidden');
                imagePreview.src = await toBase64(file);
            } else {
                imagePreview.classList.add('hidden');
                fileIcon.classList.remove('hidden');
            }
        }

        function clearFileSelection() {
            currentFile = null;
            filePreviewStrip.classList.add('hidden');
            imagePreview.src = '';
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // --- VOICE ---
        let recognition = null;
        let isListening = false;
        const voiceBtn = document.getElementById('voice-btn');

        function setupVoice() {
            if (!('webkitSpeechRecognition' in window)) {
                voiceBtn.classList.add('hidden');
                return;
            }

            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                voiceBtn.innerHTML = '<i class="fas fa-stop text-red-500 animate-pulse"></i>';
            };

            recognition.onend = () => {
                isListening = false;
                voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                userInput.value = text;
                sendMessage();
            };

            voiceBtn.addEventListener('click', () => {
                if (isListening) recognition.stop();
                else recognition.start();
            });
        }

        function speak(text) {
            // Cancel existing speech
            window.speechSynthesis.cancel();

            // Strip markdown/html for cleaner speech
            const cleanText = text.replace(/<[^>]*>/g, '').replace(/[\*\#\_]/g, '');

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        // --- EVENT LISTENERS ---
        function setupCoreListeners() {
            // Onboarding
            startBtn.addEventListener('click', () => {
                const name = document.getElementById('user-name-input').value.trim();
                const key = document.getElementById('api-key-input').value.trim();

                if (name && key) {
                    memory.userName = name;
                    localStorage.setItem(API_KEY_KEY, key);
                    saveMemory();
                    onboarding.classList.add('hidden');
                    app.classList.remove('hidden');
                    addMessage('ai', `Hello ${name}! I'm initialized and ready to assist you. How can I help today?`);
                } else {
                    alert('Please provide both a name and an API key.');
                }
            });

            // Settings
            settingsToggle.addEventListener('click', () => settingsPanel.classList.toggle('hidden'));
            closeSettings.addEventListener('click', () => settingsPanel.classList.add('hidden'));

            modelSelect.addEventListener('change', (e) => {
                memory.preferences.model = e.target.value;
                modelBadge.textContent = e.target.options[e.target.selectedIndex].text;
                saveMemory();
            });

            voiceToggle.addEventListener('change', (e) => {
                memory.preferences.voiceResponse = e.target.checked;
                saveMemory();
            });

            clearHistoryBtn.addEventListener('click', () => {
                if (confirm('Clear all conversation history?')) {
                    memory.history = [];
                    saveMemory();
                    renderHistory();
                    settingsPanel.classList.add('hidden');
                }
            });

            resetAppBtn.addEventListener('click', () => {
                if (confirm('This will wipe all data and keys. Continue?')) {
                    localStorage.removeItem(MEMORY_KEY);
                    localStorage.removeItem(API_KEY_KEY);
                    location.reload();
                }
            });

            // Auto-resize textarea
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            // Send events
            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            setupFileListeners();
            setupVoice();
        }

        // --- RENDERING ---
        const md = window.markdownit({
            html: true,
            linkify: true,
            typographer: true,
            highlight: function (str, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return '<pre class="hljs"><code>' +
                               hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
                               '</code></pre>';
                    } catch (__) {}
                }
                return '<pre class="hljs"><code>' + md.utils.escapeHtml(str) + '</code></pre>';
            }
        });

        function renderMarkdown(text) {
            // Handle LaTeX delimiters
            text = text.replace(/\\\[(.*?)\\\]/gs, (m, p1) => `$$${p1}$$`);
            text = text.replace(/\\\((.*?)\\\)/gs, (m, p1) => `$${p1}$`);

            let html = md.render(text);

            // Render KaTeX math
            html = html.replace(/\$\$(.*?)\$\$/gs, (m, p1) => {
                try {
                    return `<div class="overflow-x-auto py-2">${katex.renderToString(p1, { displayMode: true, throwOnError: false })}</div>`;
                } catch (e) { return m; }
            });

            html = html.replace(/\$(.*?)\$/g, (m, p1) => {
                try {
                    return katex.renderToString(p1, { displayMode: false, throwOnError: false });
                } catch (e) { return m; }
            });

            return html;
        }

        // --- UI HELPERS ---
        function showTyping(id) {
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex justify-start animate-pulse';
            div.innerHTML = `
                <div class="chat-bubble-ai rounded-2xl px-4 py-3 flex gap-1 items-center">
                    <span class="w-1.5 h-1.5 bg-slate-500 rounded-full typing-dot"></span>
                    <span class="w-1.5 h-1.5 bg-slate-500 rounded-full typing-dot"></span>
                    <span class="w-1.5 h-1.5 bg-slate-500 rounded-full typing-dot"></span>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function addMessage(role, content, isHistory = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2 duration-300 mb-4`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[90%] rounded-2xl px-4 py-3 text-sm ${role === 'user' ? 'chat-bubble-user text-white' : 'chat-bubble-ai text-slate-200'} prose prose-invert prose-sm`;

            // Handle Images in UI
            if (Array.isArray(content)) {
                const img = content.find(c => c.type === 'image_url');
                if (img) {
                    const imgEl = document.createElement('img');
                    imgEl.src = img.image_url.url;
                    imgEl.className = 'rounded-lg mb-2 max-h-64 object-cover border border-white/10';
                    bubble.appendChild(imgEl);
                }
            }

            const textContainer = document.createElement('div');
            const displayText = typeof content === 'string' ? content : (content.find(c => c.type === 'text')?.text || '');

            textContainer.innerHTML = renderMarkdown(displayText);
            bubble.appendChild(textContainer);

            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (!isHistory) {
                memory.history.push({ role, content });
                saveMemory();
            }
        }

        function renderHistory() {
            chatContainer.innerHTML = '';
            memory.history.forEach(msg => addMessage(msg.role, msg.content, true));
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
