<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>IAMAIHM</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=DM+Sans:wght@400;500&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a26;
      --accent: #00d4ff;
      --accent-secondary: #7b5cf0;
      --text-primary: #f0f0f5;
      --text-secondary: #8888aa;
      --border: #2a2a3a;
      --user-bubble: #1a2a4a;
      --ai-bubble: #12121a;
      --danger: #ff4466;
      --success: #00ff99;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Splash Screen */
    #splash-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      background-color: var(--bg-primary);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }
    #splash-screen .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      color: var(--accent);
      animation: pulse 1.5s ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Onboarding */
    #onboarding-screen {
      padding: 2rem;
      text-align: center;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: var(--bg-primary);
      z-index: 999;
    }
    #onboarding-screen input {
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      width: 100%;
      margin-bottom: 1rem;
    }
    #onboarding-screen button {
      padding: 0.8rem 1.5rem;
      background-color: var(--accent);
      border: none;
      border-radius: 8px;
      color: var(--bg-primary);
      font-weight: bold;
      cursor: pointer;
    }

    /* Main App */
    #app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }
    .top-bar .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      color: var(--accent);
    }
    .icon-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
    }

    /* Chat Area */
    #chat-area {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background-color: var(--bg-primary);
    }
    .message {
      max-width: 80%;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      position: relative;
    }
    .user-message {
      align-self: flex-end;
      background-color: var(--user-bubble);
      border-bottom-right-radius: 0;
    }
    .ai-message {
      align-self: flex-start;
      background-color: var(--ai-bubble);
      border-bottom-left-radius: 0;
    }
    .message-content {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message pre {
      background-color: var(--bg-secondary);
      padding: 0.5rem;
      border-radius: 4px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      margin: 0.5rem 0;
    }
    .message code {
      font-family: 'JetBrains Mono', monospace;
      background-color: var(--bg-secondary);
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
    }
    .timestamp {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 0.3rem;
      text-align: right;
    }

    /* Input Bar */
    .input-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding-bottom: env(keyboard-inset-height, 0px);
      z-index: 10;
    }
    .input-bar input {
      flex: 1;
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      color: var(--text-primary);
    }
    .input-bar .icon-btn {
      font-size: 1.2rem;
      padding: 0.5rem;
    }

    /* Install Button */
    #install-btn {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem 1rem;
      background-color: var(--accent);
      border: none;
      border-radius: 8px;
      color: var(--bg-primary);
      font-weight: bold;
      cursor: pointer;
      z-index: 20;
      display: none;
    }

    /* Voice Call Screen */
    #voice-call-screen {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-primary);
      gap: 2rem;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }
    .call-avatar {
      font-size: 5rem;
    }
    .call-timer {
      font-size: 2rem;
      color: var(--accent);
    }
    #end-call-btn {
      padding: 1rem 2rem;
      background-color: var(--danger);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* Settings Panel */
    #settings-panel {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--bg-secondary);
      padding: 1rem;
      z-index: 1000;
      overflow-y: auto;
      display: none;
    }
    #settings-panel h2 {
      margin-bottom: 1rem;
      color: var(--text-primary);
    }
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 0;
      border-bottom: 1px solid var(--border);
    }
    .setting-item label {
      color: var(--text-secondary);
    }
    .setting-item input, .setting-item select {
      background-color: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 0.5rem;
      border-radius: 4px;
    }
    #settings-panel button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      cursor: pointer;
    }

    /* Hidden Class */
    .hidden {
      display: none !important;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      gap: 0.3rem;
    }
    .typing-indicator span {
      width: 0.5rem;
      height: 0.5rem;
      background-color: var(--accent);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Code Blocks */
    .code-block-container {
      background-color: var(--bg-secondary);
      border-radius: 8px;
      margin: 1rem 0;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .code-header {
      background-color: var(--border);
      padding: 0.4rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }
    .copy-btn {
      background: none;
      border: 1px solid var(--text-secondary);
      color: var(--text-secondary);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background-color: var(--accent);
      color: var(--bg-primary);
      border-color: var(--accent);
    }
    .math-block {
      overflow-x: auto;
      padding: 1rem 0;
    }

    /* File Preview */
    #file-preview {
      position: fixed;
      bottom: 70px;
      left: 0;
      right: 0;
      background-color: var(--bg-secondary);
      padding: 1rem;
      border-top: 1px solid var(--border);
      z-index: 15;
      display: none;
    }
    #file-preview img {
      max-width: 100px;
      max-height: 100px;
      border-radius: 4px;
      margin-right: 1rem;
    }
    #file-preview .file-info {
      flex: 1;
    }
    #file-preview .file-name {
      color: var(--text-primary);
      margin-bottom: 0.3rem;
    }
    #file-preview .file-size {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }
    #file-preview button {
      background-color: var(--accent);
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      color: var(--bg-primary);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="logo">IAMAIHM</div>
  </div>

  <!-- Onboarding Screen -->
  <div id="onboarding-screen" class="hidden">
    <h1>Welcome to IAMAIHM</h1>
    <p>Your personal AI assistant</p>
    <input type="text" id="user-name" placeholder="Your Name">
    <input type="password" id="api-key" placeholder="OpenRouter API Key">
    <button id="start-btn">Start</button>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="logo">IAMAIHM</div>
      <div class="top-bar-btns">
        <button id="stop-speech-btn" class="icon-btn hidden" title="Stop Speaking">⏹️</button>
        <button id="call-btn" class="icon-btn" title="Voice Call">📞</button>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-area"></main>

    <!-- Input Bar -->
    <div class="input-bar">
      <button id="attach-btn" class="icon-btn" title="Attach File">📎</button>
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
      <button id="voice-btn" class="icon-btn" title="Voice Input">🎤</button>
      <button id="send-btn" class="icon-btn" title="Send">➤</button>
    </div>

    <!-- Install Button -->
    <button id="install-btn">Install App</button>

    <!-- File Preview -->
    <div id="file-preview">
      <img id="file-preview-img" src="" alt="Preview">
      <div class="file-info">
        <div class="file-name" id="file-preview-name"></div>
        <div class="file-size" id="file-preview-size"></div>
      </div>
      <button id="send-file-btn">Send</button>
      <button id="cancel-file-btn">Cancel</button>
    </div>
  </div>

  <!-- Voice Call Screen -->
  <div id="voice-call-screen" class="hidden">
    <div class="call-avatar">🤖</div>
    <div class="call-timer">00:00</div>
    <button id="end-call-btn">End Call</button>
  </div>

  <!-- Settings Panel -->
  <div id="settings-panel">
    <h2>Settings</h2>
    <div class="setting-item">
      <label for="voice-response-toggle">Voice Response</label>
      <input type="checkbox" id="voice-response-toggle" checked>
    </div>
    <div class="setting-item">
      <label for="theme-select">Theme</label>
      <select id="theme-select">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <div class="setting-item">
      <label for="language-select">Language</label>
      <select id="language-select">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="ur-PK">Urdu (Pakistan)</option>
      </select>
    </div>
    <div class="setting-item">
      <label for="model-select">AI Model</label>
      <select id="model-select">
        <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
        <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
        <option value="google/gemini-flash-1.5">Gemini Flash 1.5</option>
        <option value="meta-llama/llama-3.1-70b-instruct">Llama 3.1 70B</option>
        <option value="mistralai/mistral-7b-instruct">Mistral 7B</option>
      </select>
    </div>
    <button id="reset-api-key">Reset API Key</button>
    <button id="export-memory">Export Memory</button>
    <button id="import-memory">Import Memory</button>
    <button id="clear-memory">Clear Memory</button>
    <button id="close-settings">Close</button>
  </div>

  <!-- Load Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script>
    // ======================
    // APP STATE & CONFIG
    // ======================
    const APP_STATE = {
      SPLASH: 'splash',
      ONBOARDING: 'onboarding',
      CHAT: 'chat',
      VOICE_CALL: 'voice_call'
    };

    let appState = APP_STATE.SPLASH;
    let conversationHistory = [];
    let memory = {};
    let isListening = false;
    let isSpeaking = false;
    let callTimerInterval;
    let callStartTime;
    let deferredPrompt;
    let currentFile = null;
    let speechRecognition = null;
    let speechSynthesis = window.speechSynthesis;

    // DOM Elements
    const splashScreen = document.getElementById('splash-screen');
    const onboardingScreen = document.getElementById('onboarding-screen');
    const app = document.getElementById('app');
    const voiceCallScreen = document.getElementById('voice-call-screen');
    const settingsPanel = document.getElementById('settings-panel');
    const chatArea = document.getElementById('chat-area');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const voiceBtn = document.getElementById('voice-btn');
    const attachBtn = document.getElementById('attach-btn');
    const callBtn = document.getElementById('call-btn');
    const stopSpeechBtn = document.getElementById('stop-speech-btn');
    const settingsBtn = document.getElementById('settings-btn');
    const endCallBtn = document.getElementById('end-call-btn');
    const installBtn = document.getElementById('install-btn');
    const startBtn = document.getElementById('start-btn');
    const userNameInput = document.getElementById('user-name');
    const apiKeyInput = document.getElementById('api-key');
    const filePreview = document.getElementById('file-preview');
    const filePreviewImg = document.getElementById('file-preview-img');
    const filePreviewName = document.getElementById('file-preview-name');
    const filePreviewSize = document.getElementById('file-preview-size');
    const sendFileBtn = document.getElementById('send-file-btn');
    const cancelFileBtn = document.getElementById('cancel-file-btn');
    const voiceResponseToggle = document.getElementById('voice-response-toggle');
    const themeSelect = document.getElementById('theme-select');
    const languageSelect = document.getElementById('language-select');
    const modelSelect = document.getElementById('model-select');
    const resetApiKeyBtn = document.getElementById('reset-api-key');
    const exportMemoryBtn = document.getElementById('export-memory');
    const importMemoryBtn = document.getElementById('import-memory');
    const clearMemoryBtn = document.getElementById('clear-memory');
    const closeSettingsBtn = document.getElementById('close-settings');

    // System Prompt
    const SYSTEM_PROMPT = `
You are IAMAIHM — a highly capable, warm, and intelligent personal AI assistant.

Your core expertise areas:
- Advanced coding (Python, JavaScript, HTML/CSS, React, Flutter, and more)
- Science (physics, chemistry, biology, astronomy, mathematics)
- Medicine & health (symptoms, medications, anatomy, nutrition — always recommend consulting professionals)
- Web search & real-time information retrieval
- Music discovery and recommendations
- App building guidance (explain concepts in plain language, zero jargon for non-coders)
- General life assistance, productivity, and creative tasks

Behavioral rules:
- Always remember the user's name, preferences, and past conversations (provided in context)
- Be concise for simple queries, detailed for complex ones
- Format code in proper markdown code blocks
- For medical queries, provide helpful information but always include a professional consultation note
- For music, provide song names, artists, and search links (YouTube/Spotify)
- For app building, guide step-by-step in plain English — no assumed coding knowledge
- Respond in the user's language if they write in a non-English language

Memory context will be injected before each message in the format:
[MEMORY: user_name, preferences, past topics]
`.trim();

    // ======================
    // INITIALIZATION
    // ======================
    function init() {
      // Load memory
      loadMemory();

      // Check if API key exists
      const apiKey = localStorage.getItem('iamaihm_api_key');
      if (!apiKey) {
        appState = APP_STATE.ONBOARDING;
        onboardingScreen.classList.remove('hidden');
      } else {
        appState = APP_STATE.CHAT;
      }

      // Hide splash after animation
      setTimeout(() => {
        splashScreen.style.opacity = '0';
        splashScreen.style.transition = 'opacity 0.5s ease';
        setTimeout(() => {
          splashScreen.style.display = 'none';
          if (appState === APP_STATE.ONBOARDING) {
            onboardingScreen.classList.remove('hidden');
          } else {
            app.classList.remove('hidden');
          }
        }, 500);
      }, 1500);

      // Set up event listeners
      setupEventListeners();

      // Check for updates
      checkForUpdates();
    }

    // Load Memory
    function loadMemory() {
      memory = JSON.parse(localStorage.getItem('iamaihm_memory')) || {
        userName: '',
        preferences: [],
        recentTopics: [],
        conversationHistory: [],
        customInstructions: '',
        selectedModel: 'openai/gpt-4o-mini'
      };
      conversationHistory = memory.conversationHistory || [];
      if (memory.selectedModel) {
        modelSelect.value = memory.selectedModel;
      }
      if (memory.preferences && memory.preferences[0]) {
        languageSelect.value = memory.preferences[0];
      }
    }

    // ======================
    // EVENT LISTENERS
    // ======================
    function setupEventListeners() {
      // Onboarding
      startBtn.addEventListener('click', handleOnboardingSubmit);

      // Send Message
      sendBtn.addEventListener('click', sendMessage);
      messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Voice Input
      voiceBtn.addEventListener('click', toggleVoiceInput);

      // Attach File
      attachBtn.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*,.pdf,.txt,.csv,.docx,.doc,.json,.js,.py,.html,.css,.md';
        input.addEventListener('change', handleFileSelect);
        input.click();
      });

      // File Preview Buttons
      sendFileBtn.addEventListener('click', sendFile);
      cancelFileBtn.addEventListener('click', cancelFile);

      // Call Button
      callBtn.addEventListener('click', startVoiceCall);

      // End Call Button
      endCallBtn.addEventListener('click', endVoiceCall);

      // Stop Speech Button
      stopSpeechBtn.addEventListener('click', () => {
        speechSynthesis.cancel();
        isSpeaking = false;
        stopSpeechBtn.classList.add('hidden');
        if (appState === APP_STATE.VOICE_CALL) {
          resumeVoiceCallRecognition();
        }
      });

      // Settings Button
      settingsBtn.addEventListener('click', () => {
        settingsPanel.style.display = 'block';
      });

      // Close Settings
      closeSettingsBtn.addEventListener('click', () => {
        settingsPanel.style.display = 'none';
      });

      // Reset API Key
      resetApiKeyBtn.addEventListener('click', () => {
        if (confirm('Are you sure you want to reset the API key?')) {
          localStorage.removeItem('iamaihm_api_key');
          settingsPanel.style.display = 'none';
          app.classList.add('hidden');
          onboardingScreen.classList.remove('hidden');
          appState = APP_STATE.ONBOARDING;
        }
      });

      // Export Memory
      exportMemoryBtn.addEventListener('click', () => {
        const data = JSON.stringify(memory, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'iamaihm_memory_backup.json';
        a.click();
        URL.revokeObjectURL(url);
      });

      // Import Memory
      importMemoryBtn.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = (e) => {
          const file = e.target.files[0];
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const importedMemory = JSON.parse(event.target.result);
              if (confirm('Importing memory will overwrite current data. Continue?')) {
                memory = importedMemory;
                localStorage.setItem('iamaihm_memory', JSON.stringify(memory));
                location.reload();
              }
            } catch (err) {
              alert('Error parsing memory file.');
            }
          };
          reader.readAsText(file);
        };
        input.click();
      });

      // Clear Memory
      clearMemoryBtn.addEventListener('click', () => {
        if (confirm('Are you sure you want to clear all memory?')) {
          localStorage.removeItem('iamaihm_memory');
          memory = {
            userName: memory.userName || '',
            preferences: [],
            recentTopics: [],
            conversationHistory: [],
            customInstructions: ''
          };
          conversationHistory = [];
          localStorage.setItem('iamaihm_memory', JSON.stringify(memory));
          chatArea.innerHTML = '';
          alert('Memory cleared!');
        }
      });

      // Install Button
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
      });

      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            installBtn.style.display = 'none';
          }
        }
      });

      // Theme Change
      themeSelect.addEventListener('change', (e) => {
        const theme = e.target.value;
        if (theme === 'light') {
          document.documentElement.style.setProperty('--bg-primary', '#f5f5f5');
          document.documentElement.style.setProperty('--bg-secondary', '#e0e0e0');
          document.documentElement.style.setProperty('--bg-card', '#ffffff');
          document.documentElement.style.setProperty('--text-primary', '#222222');
          document.documentElement.style.setProperty('--text-secondary', '#666666');
          document.documentElement.style.setProperty('--border', '#cccccc');
          document.documentElement.style.setProperty('--user-bubble', '#e3f2fd');
          document.documentElement.style.setProperty('--ai-bubble', '#f1f1f1');
        } else {
          document.documentElement.style.setProperty('--bg-primary', '#0a0a0f');
          document.documentElement.style.setProperty('--bg-secondary', '#12121a');
          document.documentElement.style.setProperty('--bg-card', '#1a1a26');
          document.documentElement.style.setProperty('--text-primary', '#f0f0f5');
          document.documentElement.style.setProperty('--text-secondary', '#8888aa');
          document.documentElement.style.setProperty('--border', '#2a2a3a');
          document.documentElement.style.setProperty('--user-bubble', '#1a2a4a');
          document.documentElement.style.setProperty('--ai-bubble', '#12121a');
        }
      });

      // Language Change
      languageSelect.addEventListener('change', (e) => {
        const lang = e.target.value;
        if (speechRecognition) {
          speechRecognition.lang = lang;
        }
        memory.preferences = [lang];
        localStorage.setItem('iamaihm_memory', JSON.stringify(memory));
      });

      // Model Change
      modelSelect.addEventListener('change', (e) => {
        memory.selectedModel = e.target.value;
        localStorage.setItem('iamaihm_memory', JSON.stringify(memory));
      });
    }

    // ======================
    // ONBOARDING
    // ======================
    function handleOnboardingSubmit() {
      const userName = userNameInput.value.trim();
      const apiKey = apiKeyInput.value.trim();
      if (!userName || !apiKey) {
        alert('Please enter your name and API key.');
        return;
      }

      // Save API key and user name
      localStorage.setItem('iamaihm_api_key', apiKey);
      memory.userName = userName;
      memory.preferences = [languageSelect.value || 'en-US'];
      localStorage.setItem('iamaihm_memory', JSON.stringify(memory));

      // Hide onboarding, show app
      onboardingScreen.classList.add('hidden');
      app.classList.remove('hidden');
      appState = APP_STATE.CHAT;

      // Add welcome message
      setTimeout(() => {
        addMessageToChat('ai', `Hello, ${userName}! I'm IAMAIHM, your personal AI assistant. How can I help you today?`);
      }, 500);
    }

    // ======================
    // CHAT FUNCTIONS
    // ======================
    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;

      // Add user message to chat
      addMessageToChat('user', message);
      messageInput.value = '';

      // Add to conversation history
      conversationHistory.push({ role: 'user', content: message });
      memory.conversationHistory = conversationHistory;
      localStorage.setItem('iamaihm_memory', JSON.stringify(memory));

      // Show typing indicator
      const typingIndicator = addMessageToChat('ai', '<div class="typing-indicator"><span></span><span></span><span></span></div>', true);

      try {
        // Call OpenRouter API
        const response = await callOpenRouterAPI(conversationHistory);
        let aiMessage = response.choices[0].message.content;

        // Update chat
        typingIndicator.querySelector('.message-content').innerHTML = renderMarkdown(aiMessage);
        conversationHistory.push({ role: 'assistant', content: aiMessage });

        // Update topics
        updateTopicsHeuristic(message, aiMessage);

        memory.conversationHistory = conversationHistory;
        localStorage.setItem('iamaihm_memory', JSON.stringify(memory));

        // Speak response if enabled
        if (voiceResponseToggle.checked) {
          speak(aiMessage);
        }
      } catch (error) {
        typingIndicator.querySelector('.message-content').textContent = 'Error: Could not get a response. Please check your API key.';
        console.error('API Error:', error);
      }
    }

    // Add Message to Chat
    function addMessageToChat(sender, content, isTyping = false) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', `${sender}-message`);

      const contentDiv = document.createElement('div');
      contentDiv.classList.add('message-content');
      if (isTyping) {
        contentDiv.innerHTML = content;
      } else {
        contentDiv.innerHTML = renderMarkdown(content);
      }

      const timestamp = document.createElement('div');
      timestamp.classList.add('timestamp');
      timestamp.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      messageDiv.appendChild(contentDiv);
      messageDiv.appendChild(timestamp);
      chatArea.appendChild(messageDiv);
      chatArea.scrollTop = chatArea.scrollHeight;
      return messageDiv;
    }

    // Render Markdown
    function renderMarkdown(text) {
      const md = window.markdownit({
        html: true,
        linkify: true,
        breaks: true,
        highlight: function (str, lang) {
          if (lang && hljs.getLanguage(lang)) {
            try {
              return hljs.highlight(str, { language: lang }).value;
            } catch (__) {}
          }
          return '';
        }
      });

      // Custom rendering for fenced code blocks
      md.renderer.rules.fence = function(tokens, idx, options, env, self) {
        const token = tokens[idx];
        const content = token.content;
        const lang = token.info ? token.info.trim() : '';
        const highlighted = lang && hljs.getLanguage(lang)
          ? hljs.highlight(content, { language: lang }).value
          : md.utils.escapeHtml(content);

        return `<div class="code-block-container">
          <div class="code-header">
            <span>${lang || 'code'}</span>
            <button class="copy-btn" onclick="copyToClipboard(this)">Copy</button>
          </div>
          <pre><code class="hljs ${lang}">${highlighted}</code></pre>
        </div>`;
      };

      // Render math delimiters
      text = text.replace(/\\\[(.*?)\\\]/gs, (match, p1) => `$$${p1}$$`);
      text = text.replace(/\\\((.*?)\\\)/gs, (match, p1) => `$${p1}$`);

      // Render KaTeX
      let html = md.render(text);

      html = html.replace(/\$\$(.*?)\$\$/gs, (match, p1) => {
        try {
          return `<div class="math-block">${katex.renderToString(p1, { displayMode: true, throwOnError: false })}</div>`;
        } catch (e) { return match; }
      });

      html = html.replace(/\$(.*?)\$/g, (match, p1) => {
        try {
          return katex.renderToString(p1, { displayMode: false, throwOnError: false });
        } catch (e) { return match; }
      });

      return html;
    }

    function copyToClipboard(btn) {
      const code = btn.parentElement.nextElementSibling.innerText;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
      });
    }

    function updateTopicsHeuristic(userMsg, aiMsg) {
      const stopWords = new Set(['the', 'and', 'for', 'you', 'can', 'with', 'what', 'how', 'is', 'it', 'to', 'in', 'of', 'a', 'an']);
      const combined = (userMsg + ' ' + aiMsg).toLowerCase();
      const words = combined.match(/\b[a-z]{4,}\b/g) || [];

      const counts = {};
      words.forEach(word => {
        if (!stopWords.has(word)) {
          counts[word] = (counts[word] || 0) + 1;
        }
      });

      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const newTopics = sorted.slice(0, 3).map(entry => entry[0]);

      if (!memory.recentTopics) memory.recentTopics = [];
      memory.recentTopics = [...new Set([...newTopics, ...memory.recentTopics])].slice(0, 10);
    }

    // ======================
    // VOICE FUNCTIONS
    // ======================
    function toggleVoiceInput() {
      if (isListening) {
        stopListening();
      } else {
        startListening();
      }
    }

    function startListening() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Voice input is not supported in your browser.');
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      speechRecognition = new SpeechRecognition();
      speechRecognition.continuous = false;
      speechRecognition.interimResults = false;
      speechRecognition.lang = languageSelect.value || 'en-US';

      speechRecognition.onstart = () => {
        isListening = true;
        voiceBtn.textContent = '🛑';
        messageInput.placeholder = 'Listening...';
      };

      speechRecognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        messageInput.value = transcript;
        sendMessage();
      };

      speechRecognition.onerror = (event) => {
        console.error('Voice recognition error:', event.error);
        stopListening();
      };

      speechRecognition.onend = () => {
        stopListening();
      };

      speechRecognition.start();
    }

    function stopListening() {
      if (speechRecognition) {
        speechRecognition.stop();
      }
      isListening = false;
      voiceBtn.textContent = '🎤';
      messageInput.placeholder = 'Type a message...';
    }

    function speak(text) {
      if (isSpeaking) {
        speechSynthesis.cancel();
        isSpeaking = false;
        stopSpeechBtn.classList.add('hidden');
        if (appState === APP_STATE.VOICE_CALL) {
          resumeVoiceCallRecognition();
        }
        return;
      }

      // Cancel any ongoing speech
      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = languageSelect.value || 'en-US';
      utterance.onstart = () => {
        isSpeaking = true;
        stopSpeechBtn.classList.remove('hidden');
        if (appState === APP_STATE.VOICE_CALL) {
          pauseVoiceCallRecognition();
        }
      };
      utterance.onend = () => {
        isSpeaking = false;
        stopSpeechBtn.classList.add('hidden');
        if (appState === APP_STATE.VOICE_CALL) {
          resumeVoiceCallRecognition();
        }
      };
      utterance.onerror = (event) => {
        console.error('Speech synthesis error:', event);
        isSpeaking = false;
        stopSpeechBtn.classList.add('hidden');
        if (appState === APP_STATE.VOICE_CALL) {
          resumeVoiceCallRecognition();
        }
      };

      speechSynthesis.speak(utterance);
    }

    function pauseVoiceCallRecognition() {
      if (speechRecognition && appState === APP_STATE.VOICE_CALL) {
        speechRecognition.stop();
      }
    }

    function resumeVoiceCallRecognition() {
      if (speechRecognition && appState === APP_STATE.VOICE_CALL && !isSpeaking) {
        try {
          speechRecognition.start();
        } catch (e) {
          console.error('Failed to restart speech recognition:', e);
        }
      }
    }

    // ======================
    // VOICE CALL MODE
    // ======================
    function startVoiceCall() {
      app.classList.add('hidden');
      voiceCallScreen.classList.remove('hidden');
      callStartTime = Date.now();
      callTimerInterval = setInterval(updateCallTimer, 1000);
      startContinuousVoiceLoop();
    }

    function endVoiceCall() {
      clearInterval(callTimerInterval);
      voiceCallScreen.classList.add('hidden');
      app.classList.remove('hidden');
      stopContinuousVoiceLoop();
    }

    function updateCallTimer() {
      const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
      const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const seconds = (elapsed % 60).toString().padStart(2, '0');
      document.querySelector('.call-timer').textContent = `${minutes}:${seconds}`;
    }

    function startContinuousVoiceLoop() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Voice input is not supported in your browser.');
        endVoiceCall();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      speechRecognition = new SpeechRecognition();
      speechRecognition.continuous = true;
      speechRecognition.interimResults = true;
      speechRecognition.lang = languageSelect.value || 'en-US';

      speechRecognition.onresult = async (event) => {
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          }
        }
        if (finalTranscript) {
          conversationHistory.push({ role: 'user', content: finalTranscript });
          try {
            const response = await callOpenRouterAPI(conversationHistory);
            const aiMessage = response.choices[0].message.content;
            conversationHistory.push({ role: 'assistant', content: aiMessage });
            memory.conversationHistory = conversationHistory;
            localStorage.setItem('iamaihm_memory', JSON.stringify(memory));
            speak(aiMessage);
          } catch (error) {
            console.error('API Error:', error);
            speak("Sorry, I couldn't process that. Please try again.");
          }
        }
      };

      speechRecognition.onerror = (event) => {
        console.error('Voice recognition error:', event.error);
      };

      speechRecognition.start();
    }

    function stopContinuousVoiceLoop() {
      if (speechRecognition) {
        speechRecognition.stop();
      }
    }

    // ======================
    // FILE UPLOAD
    // ======================
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      currentFile = file;
      filePreview.style.display = 'flex';

      if (file.type.startsWith('image/')) {
        filePreviewImg.style.display = 'block';
        const reader = new FileReader();
        reader.onload = (e) => {
          filePreviewImg.src = e.target.result;
        };
        reader.readAsDataURL(file);
      } else {
        filePreviewImg.style.display = 'none';
      }

      filePreviewName.textContent = file.name;
      filePreviewSize.textContent = formatFileSize(file.size);
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' bytes';
      else if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
      else return (bytes / 1048576).toFixed(2) + ' MB';
    }

    function sendFile() {
      if (!currentFile) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        const content = e.target.result;
        let displayMessage = `User uploaded a file: ${currentFile.name}\n\n`;
        let apiContent;

        if (currentFile.type.startsWith('image/')) {
          displayMessage += `![${currentFile.name}](${content})`;
          apiContent = [
            { type: 'text', text: `User uploaded an image: ${currentFile.name}` },
            { type: 'image_url', image_url: { url: content } }
          ];
          addMessageToChat('user', displayMessage);
          conversationHistory.push({ role: 'user', content: apiContent, displayContent: displayMessage });
        } else {
          // For text files, extract content
          if (currentFile.type.startsWith('text/') || currentFile.name.endsWith('.json') || currentFile.name.endsWith('.csv') || currentFile.name.endsWith('.js') || currentFile.name.endsWith('.py') || currentFile.name.endsWith('.html') || currentFile.name.endsWith('.css')) {
            displayMessage += '```\n' + content + '\n```';
          } else {
            displayMessage += `[File: ${currentFile.name} (${formatFileSize(currentFile.size)})]`;
          }
          addMessageToChat('user', displayMessage);
          conversationHistory.push({ role: 'user', content: displayMessage });
        }

        memory.conversationHistory = conversationHistory;
        localStorage.setItem('iamaihm_memory', JSON.stringify(memory));

        // Show typing indicator
        const typingIndicator = addMessageToChat('ai', '<div class="typing-indicator"><span></span><span></span><span></span></div>', true);

        try {
          const response = await callOpenRouterAPI(conversationHistory);
          const aiMessage = response.choices[0].message.content;
          typingIndicator.querySelector('.message-content').innerHTML = renderMarkdown(aiMessage);
          conversationHistory.push({ role: 'assistant', content: aiMessage });
          memory.conversationHistory = conversationHistory;
          localStorage.setItem('iamaihm_memory', JSON.stringify(memory));

          if (voiceResponseToggle.checked) {
            speak(aiMessage);
          }
        } catch (error) {
          typingIndicator.querySelector('.message-content').textContent = 'Error: Could not get a response.';
          console.error('API Error:', error);
        }

        cancelFile();
      };

      if (currentFile.type.startsWith('image/')) {
        reader.readAsDataURL(currentFile);
      } else {
        reader.readAsText(currentFile);
      }
    }

    function cancelFile() {
      currentFile = null;
      filePreview.style.display = 'none';
      filePreviewImg.src = '';
    }

    // ======================
    // OPENROUTER API
    // ======================
    async function callOpenRouterAPI(messages) {
      const apiKey = localStorage.getItem('iamaihm_api_key');
      if (!apiKey) {
        throw new Error('API key not set.');
      }

      // Inject memory context
      const memoryContext = `[MEMORY: Name=${memory.userName || 'User'}, Preferences=${memory.preferences?.join(', ') || 'None'}, Recent topics=${memory.recentTopics?.join(', ') || 'None'}]`;
      const systemMessage = { role: 'system', content: SYSTEM_PROMPT + '\n\n' + memoryContext };

      // Prepare messages for API (handle vision support)
      const apiMessages = [
        systemMessage,
        ...messages.map(msg => ({ role: msg.role, content: msg.content }))
      ];

      // Call OpenRouter API
      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: memory.selectedModel || 'openai/gpt-4o-mini',
          messages: apiMessages,
          max_tokens: 4096,
          temperature: 0.7
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(`API request failed: ${response.statusText}\n${errorData.error?.message || ''}`);
      }

      return await response.json();
    }

    // ======================
    // SERVICE WORKER
    // ======================
    function checkForUpdates() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
      }
    }

    // ======================
    // MANIFEST (Embedded)
    // ======================
    function registerManifest() {
      const manifest = {
        name: 'IAMAIHM',
        short_name: 'IAMAIHM',
        description: 'Your personal AI assistant — voice, vision, code, science & more.',
        start_url: '/',
        scope: '/',
        display: 'standalone',
        orientation: 'portrait',
        theme_color: '#0a0a0f',
        background_color: '#0a0a0f',
        icons: [
          {
            src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%230a0a0f"/><text x="50" y="65" font-family="Arial, sans-serif" font-size="50" fill="%2300d4ff" text-anchor="middle">IHM</text></svg>',
            sizes: '192x192',
            type: 'image/svg+xml'
          },
          {
            src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%230a0a0f"/><text x="50" y="65" font-family="Arial, sans-serif" font-size="50" fill="%2300d4ff" text-anchor="middle">IHM</text></svg>',
            sizes: '512x512',
            type: 'image/svg+xml'
          }
        ],
        interactive_widget: {
          resizes: 'content'
        }
      };

      // Create a blob URL for the manifest
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const manifestUrl = URL.createObjectURL(manifestBlob);

      // Create a link element to set the manifest
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);
    }

    // ======================
    // SERVICE WORKER REGISTRATION
    // ======================
    function registerServiceWorker() {
      const swCode = `
        const CACHE_NAME = 'iamaihm-v1';
        const SHELL_ASSETS = ['/', '/index.html'];

        self.addEventListener('install', (e) => {
          e.waitUntil(
            caches.open(CACHE_NAME).then((cache) => {
              return cache.addAll(SHELL_ASSETS);
            })
          );
        });

        self.addEventListener('fetch', (e) => {
          e.respondWith(
            caches.match(e.request).then((cachedResponse) => {
              return cachedResponse || fetch(e.request);
            })
          );
        });
      `;

      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);

      // Register the service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(swUrl).catch(err => {
          console.error('Service Worker registration failed:', err);
        });
      }
    }

    // ======================
    // INITIALIZE APP
    // ======================
    // Register manifest and service worker
    registerManifest();
    registerServiceWorker();

    // Initialize the app
    document.addEventListener('DOMContentLoaded', init);
  </script>
